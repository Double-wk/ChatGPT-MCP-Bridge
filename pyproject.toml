[project]
name = "chatgpt-mcp-bridge"
dynamic = ["version"]
description = "Native Codex development workflows for ChatGPT over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{name = "Double-wk"}]
dependencies = ["mcp>=2.3.0,<3.0.0", "structlog>=26.1.0,<27.0.0", "uvicorn>=0.38,<1", "starlette>=0.46,<2", "jsonschema>=4.20,<5"]

[project.scripts]
chatgpt-mcp-bridge = "chatgpt_mcp_bridge.server:main"

[project.optional-dependencies]
gateway = ["httpx>=0.27,<1", "python-multipart>=0.0.9", "starlette>=0.46,<2"]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff==0.17.0", "hatchling"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/chatgpt_mcp_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_mcp_bridge"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"src/chatgpt_mcp_bridge/bin/chatgpt-mcp-bridge" = "chatgpt_mcp_bridge/bin/chatgpt-mcp-bridge"
"src/chatgpt_mcp_bridge/bin/chatgpt-mcp-bridge-runtime" = "chatgpt_mcp_bridge/bin/chatgpt-mcp-bridge-runtime"
"src/chatgpt_mcp_bridge/bin/codex-linux-sandbox" = "chatgpt_mcp_bridge/bin/codex-linux-sandbox"
"src/chatgpt_mcp_bridge/bin/codex-resources/bwrap" = "chatgpt_mcp_bridge/bin/codex-resources/bwrap"
"vendor/codex/LICENSE" = "chatgpt_mcp_bridge/licenses/codex-LICENSE"
"vendor/codex/NOTICE" = "chatgpt_mcp_bridge/licenses/codex-NOTICE"
"vendor/codex/codex-rs/vendor/bubblewrap/COPYING" = "chatgpt_mcp_bridge/licenses/bubblewrap-COPYING"
"THIRD_PARTY_NOTICES.md" = "chatgpt_mcp_bridge/licenses/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = ["src", "runtime/Cargo.toml", "runtime/Cargo.lock", "runtime/src", "runtime/agent/Cargo.toml", "runtime/agent/Cargo.lock", "runtime/agent/src", "runtime/bwrap/Cargo.toml", "runtime/bwrap/Cargo.lock", "vendor", "patches", "deploy", "plugin", "scripts", "docs", "hatch_build.py", "README.md", "README.en.md", "THIRD_PARTY_NOTICES.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
