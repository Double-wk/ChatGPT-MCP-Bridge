name: Validate SSH MCP packaging and deployment

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check shell syntax
        run: bash -n deploy/setup-conda.sh deploy/run-http.sh deploy/run-stdio.sh deploy/start-nohup.sh cloudflared/run-oauth-tunnel.sh
      - name: Compile Python source
        run: python -m compileall -q src gateway scripts deploy integration/tests
      - name: Install gateway test dependencies
        run: python -m pip install 'starlette>=0.46,<2' 'httpx>=0.27,<1' 'python-multipart>=0.0.9'
      - name: Run integration package and OAuth-route tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s integration/tests -p 'test*.py' -v
